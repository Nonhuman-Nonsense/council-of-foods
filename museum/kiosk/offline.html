  <p id="detail"></p>
  <p class="note">The council starts again by itself once the connection is back.</p>

<script>
  const COPY = {
    "no-network": ["No network", "Check the network cable or Wi‑Fi."],
    "no-internet": ["No internet", "Check the router and the internet connection."],
    "no-server": ["Server error", "The council's server isn't responding. Nothing to fix here."],
  };

  const role = location.hash.slice(1) || "council";

  function show() {
    const status = window.kioskStatus;
    if (!status || !COPY[status.problem]) return;
    const [title, detail] = COPY[status.problem];
    document.getElementById("title").textContent = title;
    document.getElementById("detail").textContent = `${detail} (Since ${status.since}.)`;
  }

  // The script rewrites the status file as the connection changes; read it again every few seconds.
  function refresh() {
    const script = document.createElement("script");
    script.src = `offline-${role}.js?${Date.now()}`;
    script.onload = script.onerror = () => {
      script.remove();
      show();
    };
    document.body.appendChild(script);
  }

  refresh();
  setInterval(refresh, 3000);

  const CURSOR_IDLE_MS = 3000;
  let cursorTimer;
  function showCursor() {
    document.documentElement.classList.remove("cursor-hidden");
    clearTimeout(cursorTimer);
    cursorTimer = setTimeout(() => document.documentElement.classList.add("cursor-hidden"), CURSOR_IDLE_MS);
  }
  window.addEventListener("mousemove", showCursor);
  showCursor();
</script>
